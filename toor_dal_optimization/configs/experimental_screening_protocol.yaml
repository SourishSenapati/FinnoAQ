experimental_protocol:
  version: 2.0.0
  date: '2026-10-15'
  status: READY_FOR_KITCHEN_EXECUTION
  target_material:
    species: Cajanus cajan
    product_form: Split dehulled cotyledons (Toor Dal)
    origin: Tanzania
    incoming_moisture_wb_pct: 10
    half_thickness_mm: 1.3
    bulk_density_kg_m3: 850
  cooker_specifications:
    type: Hawkins / Prestige Stainless Steel Domestic Pressure Cooker
    volume_litres: 3
    operating_pressure_psi: 15
    operating_pressure_bar_gauge: 1.03
    saturated_steam_temperature_c: 115
    heating_power_watts: 1200
  cooking_batch_charge:
    dal_mass_grams: 100
    water_mass_grams: 350
    dal_to_water_ratio: 3.5
    water_quality: Potable softened water (< 50 ppm CaCO3, pH 7.0)
  screening_candidates:
    - id: EXP-001
      name: Untreated Control
      reagent: None
      conc_pct_in_liquor: 0
      liquor_ratio: 0
      soak_time_min: 0
      post_soak_drying_temp_c: 0
      expected_cook_time_min: 22
      expected_whistles: 6
    - id: EXP-002
      name: Cold Water Soak
      reagent: Potable Water
      conc_pct_in_liquor: 0
      liquor_ratio: 1.5
      soak_time_min: 30
      post_soak_drying_temp_c: 55
      expected_cook_time_min: 20.5
      expected_whistles: 5.2
    - id: EXP-003
      name: Warm Water Soak
      reagent: Potable Water
      conc_pct_in_liquor: 0
      liquor_ratio: 1.5
      soak_time_min: 30
      soak_temp_c: 45
      post_soak_drying_temp_c: 55
      expected_cook_time_min: 20
      expected_whistles: 5
    - id: EXP-005
      name: Low-Dose Sodium Bicarbonate
      reagent: Food-Grade NaHCO3 (INS 500(ii))
      conc_pct_in_liquor: 0.1
      liquor_ratio: 1.5
      soak_time_min: 30
      post_soak_drying_temp_c: 55
      expected_cook_time_min: 18.2
      expected_whistles: 4.5
    - id: EXP-006
      name: Medium-Dose Sodium Bicarbonate
      reagent: Food-Grade NaHCO3 (INS 500(ii))
      conc_pct_in_liquor: 0.25
      liquor_ratio: 1.5
      soak_time_min: 30
      post_soak_drying_temp_c: 55
      expected_cook_time_min: 16
      expected_whistles: 3.8
    - id: EXP-007
      name: Nominal Winner Sodium Bicarbonate
      reagent: Food-Grade NaHCO3 (INS 500(ii))
      conc_pct_in_liquor: 0.5
      liquor_ratio: 1.5
      soak_time_min: 30
      post_soak_drying_temp_c: 55
      expected_cook_time_min: 13.8
      expected_whistles: 3.1
    - id: EXP-008
      name: Gourmet Sodium Citrate
      reagent: Food-Grade Trisodium Citrate
      conc_pct_in_liquor: 0.5
      liquor_ratio: 1.5
      soak_time_min: 30
      post_soak_drying_temp_c: 55
      expected_cook_time_min: 14.6
      expected_whistles: 3.4
  statistical_design:
    test_type: Two-sample Welch's t-test (two-tailed)
    degrees_of_freedom: 6
    replicates_per_group: 4
    alpha_significance_level: 0.005
    critical_t_statistic: 3.707
    p_value_threshold: 0.005
    max_allowable_standard_deviation_seconds: 90
    five_sigma_sample_sd_threshold_seconds: 30