# FinnoaQ Toor Dal — Resource & Compute Budget Configuration
# Hardware Target: AMD Ryzen AI 9 365 + NVIDIA GeForce RTX 4050 Laptop GPU

hardware_budget:
  gpu:
    model: "NVIDIA GeForce RTX 4050 Laptop GPU"
    physical_vram_mb: 6140.5
    os_display_reserved_mb: 1640.5
    soft_vram_ceiling_mb: 4500.0  # 73.3% of physical VRAM
    hard_vram_limit_mb: 5120.0    # 83.4% of physical VRAM
    max_concurrent_gpu_workers: 1
    device_id: 0
    allow_tf32: true
    cudnn_benchmark: true

  cpu:
    physical_cores: 10
    logical_cores: 20
    max_cpu_worker_threads: 4
    system_ram_total_gb: 23.12
    min_system_ram_free_gb: 1.0

batching_limits:
  level_b_reduced_order_grains_per_batch: 25000
  level_c_spatial_8192_grains_per_batch: 10000
  max_unbatched_3d_grains: 10000  # Enforces memory safety against 65 GB OOM crash
  monte_carlo_checkpoint_frequency_cycles: 50

supervision:
  checkpoint_interval_seconds: 300
  heartbeat_interval_seconds: 30
  max_identical_error_retries: 3
  task_timeout_seconds: 7200
  atomic_write_strategy: "temp_then_replace"
